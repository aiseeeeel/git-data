<head>

<title>merge или branch -D</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--txt:#c9d1d9;--dim:#7d8590;--faint:#484f58;--main:#58a6ff;--live:#3fb950;--red:#f85149;--hash:#e3b341}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .wrap{max-width:1660px;margin:0 auto;padding:28px 16px 48px}
  .crumbs{font-size:14px;color:var(--dim);margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .crumbs a{color:var(--main)}.crumbs b{color:var(--main)}
  .crumbs .pill{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px}
  h1{font-size:clamp(24px,3.4vw,40px);margin:0 0 8px;font-weight:800}
  h1 .k{color:var(--dim);font-weight:400} h1 .a{color:var(--main)} h1 .b{color:var(--live)}
  .sub{color:var(--dim);font-size:14px;margin:0 0 18px;max-width:960px;line-height:1.55}
  .sub:empty{display:none}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);font-size:13px;margin-top:18px}
  .tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);font:inherit;padding:8px 14px;cursor:pointer;display:flex;gap:7px;align-items:center}
  .tabs button:hover{color:var(--fg)} .tabs button.on{color:var(--fg);border-bottom-color:#f78166}
  .tabs svg{width:14px;height:14px}
  .frame{border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px}
  .panel[hidden]{display:none}
  .bar{padding:12px 16px 14px;border-bottom:1px solid var(--line)}
  .bar .cmd{color:var(--dim);font-size:13px;margin:0 0 10px}.bar .cmd b{color:var(--live)}
  .legend{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:12px;color:var(--dim);align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend b{color:var(--txt);font-weight:600}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px}
  #g{width:100%;height:auto;display:block}
  .dot{cursor:help}
  .hov{cursor:help}
  .hit{stroke:transparent;stroke-width:12;fill:none;cursor:help}
  .hit:hover+.vis{stroke-width:3.4}
  /* лог */
  .log{font-size:12.5px}
  .row{display:grid;grid-template-columns:minmax(0,1fr) 150px 250px 86px;gap:16px;padding:0 16px;height:22px;align-items:center;white-space:nowrap}
  .row>*{overflow:hidden;text-overflow:ellipsis}
  .row.h{background:#161b22;color:var(--dim);font-weight:600;height:30px}
  .row:not(.h){cursor:help}.row:not(.h):hover{background:#161b22}
  .row .m{color:var(--fg);font-weight:600} .row .t{color:var(--txt)} .row .d{color:var(--dim)} .row .x{color:var(--hash)}
  .row.dim .t,.row.dim .d{color:var(--faint)}
  .bd{font-style:normal;display:inline-block;font-size:11px;line-height:15px;padding:0 6px;border:1px solid;border-radius:4px;margin-right:6px}
  .bd.head{background:#0c2d4d;border-color:var(--main);color:#a5d6ff}
  .bd.tag{background:#3a2a00;border-color:var(--hash);color:#f2cc60}
  .bd.live{background:#0f2e1a;border-color:var(--live);color:#7ee787}
  .bd.gone{background:#161b22;border-color:var(--faint);color:var(--dim);text-decoration:line-through}
  .tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-size:12px;line-height:1.55;max-width:340px;opacity:0;transition:opacity .12s;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .tip b{color:var(--fg)} .tip .k{color:var(--dim)} .tip .h{color:var(--hash)}
</style>

/* ---------- общая модель данных (одинакова во всех вариантах) ---------- */
function rng(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function simulate(){
  const R=rng(47), TEAMS=47, FINAL=21, PRESENTED=18;
  const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const surv=new Set(sh([...Array(TEAMS).keys()]).slice(0,FINAL));
  const unm=new Set(sh([...surv]).slice(0,FINAL-PRESENTED));
  const hex=()=>Math.floor(R()*0xfffffff).toString(16).padStart(7,'0');
  const POOL=['feat: первый прототип','fix: баги после ревью','docs: README','wip: интеграция модулей','refactor: структура проекта','feat: MVP','test: первые тесты','chore: настройка окружения','feat: интерфейс','fix: падает на старте'];
  const ev=[], teams=[];
  const M=(t,msg,tip,x={})=>ev.push(Object.assign({t,lane:-1,msg,tip,hash:hex()},x));
  M(0,'init: открыта регистрация','Открыта регистрация на Летнюю школу.');
  M(1,'add: 230 заявок на участие','<b>230</b> школьников подали заявку.',{label:'230 заявок'});
  M(2,'day-1: на старт вышли 175 из 230','<b>175</b> из 230 пришли в первый день — 76%.<br><b>55</b> заявок так и не превратились в участников.',{label:'175 пришли'});
  M(3,'checkout -b ×47: собраны команды','<b>47</b> команд сформировано из 175 участников.<br>Каждая команда — отдельная ветка.',{fork:true,label:'47 команд'});
  for(let k=0;k<TEAMS;k++){
    const name='team-'+String(k+1).padStart(2,'0');
    const alive=surv.has(k), unmerged=unm.has(k), merged=alive&&!unmerged;
    const tc=3.5+k*.12, tend=alive?86+R()*3:10+R()*72;
    const extra=Math.floor(R()*3), times=[tc];
    const mids=[];for(let i=0;i<extra;i++)mids.push(tc+(tend-tc)*(.15+R()*.7));
    times.push(...mids.sort((a,b)=>a-b),tend);
    const team={k,name,alive,unmerged,merged,n:times.length,commits:[]};
    times.forEach((t,i)=>{
      const last=i===times.length-1;
      let msg=i===0?'init: команда в сборе':POOL[Math.floor(R()*POOL.length)];
      if(last&&alive) msg=merged?'final: проект готов к защите':'final: проект собран, на защиту не вышли';
      const e={t,lane:k,team,i:i+1,first:i===0,last,msg,hash:hex()};ev.push(e);team.commits.push(e);
    });
    teams.push(team);
  }
  M(90,'checkpoint: в финале 21 команда, 52 участника','<b>21</b> из 47 команд дошли до конца — 45%.<br><b>52</b> участника из 175 пришедших — 30%.',{final:true,label:'21 в финале'});
  teams.filter(t=>t.merged).forEach((t,r)=>{t.rank=r+1;t.mt=90.5+r*.45;M(t.mt,`Merge branch '${t.name}'`,`<b>${t.name}</b> представила проект.<br><span class="k">Слияние ${r+1} из 18</span>`,{merge:t})});
  M(99,'release: demo day — 18 проектов','<b>18</b> проектов представлено.<br>Путь школы: 230 → 175 → 47 команд → 21 → 18.',{release:true});
  return {ev,teams};
}

  const x=e.fork?FORKX:X(e.t), g=el('g',{class:'dot'},L.nodes);

  else if(e.merge) el('circle',{cx:x,cy:MY,r:4.2,fill:C.live},g);
  else el('circle',{cx:x,cy:MY,r:5,fill:C.bg,stroke:C.main,'stroke-width':2.4},g);
  el('circle',{cx:x,cy:MY,r:10,fill:'transparent'},g);
  tipOn(g,`<span class="h">${e.hash}</span> ${e.msg}<br>${e.tip}`);
  if(e.label){lab++;txt(L.labels,x,MY-16,e.label,{'text-anchor':'middle',fill:C.fg,'font-size':12});}
});

/* ================= LOG (только описание) ================= */
(()=>{
  let s=7;const R=()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const hex=()=>Math.floor(R()*0xfffffff).toString(16).padStart(7,'0');
  const rows=[];
  rows.push({t:0,main:true,msg:'init: открыта регистрация',author:'school',stage:'регистрация',tip:'Открыта регистрация на Летнюю школу.'});
  people.forEach((p,i)=>rows.push({t:1+i*1e-3,reg:p,msg:`register: ${p.city}, ${grade(p.grade)}`,author:'Школьник '+p.id,stage:'регистрация',tip:personTip(p)}));
  rows.push({t:2,main:true,msg:`checkout -b ×${teams.length}: собраны команды`,author:'school',stage:'команды',tip:`<b>${teams.length}</b> команд, <b>${MEMBERS}</b> участников.`});
  teams.forEach(t=>rows.push({t:3+t.n*1e-3,team:t,msg:`init: ${t.title.toLowerCase()} в сборе, ${plural(t.members,'участник','участника','участников')}`,author:t.branch,stage:'команды',tip:teamTip(t)}));
  for(let L=1;L<=3;L++) TR.forEach((tr,j)=>teams.forEach(t=>{ if(t.p[j]>=L)
    rows.push({t:3+L+j*.1+t.n*1e-3,team:t,msg:`feat(${tr.k}): ${tr.name} — этап ${L}/3`,author:t.branch,stage:`${tr.short} · этап ${L}`,
      tip:`<b>${t.title}</b> · ${tr.name}<br>Пройден этап <b>${L}</b> из 3<br><span class="k">Всего по треку: ${t.p[j]}/3</span>`})}));
  [...teams].filter(t=>t.total>0).sort((a,b)=>b.total-a.total||a.n-b.n).forEach((t,r)=>
    rows.push({t:8+r*1e-3,main:true,merge:true,msg:`Merge branch '${t.branch}' (${t.total}/12)`,author:'school',stage:'итог',tip:`${t.title} слита в main с итогом <b>${t.total}/12</b><br>${trackLine(t)}`}));
  rows.push({t:9,main:true,release:true,msg:'release: итоги смены',author:'school',stage:'итог',
    tip:`<b>${STEPS}</b> из ${teams.length*12} этапов пройдено.<br>${TR.map(tr=>`${tr.name}: хотели ${tr.want}/${N}, сделали ${tr.done}/${MAXT}`).join('<br>')}`});
  rows.sort((a,b)=>b.t-a.t);
  rows.forEach(r=>r.hash=hex());
  // бейдж ветки на её последнем коммите
  const seen=new Set();
  rows.forEach(r=>{if(r.team&&!seen.has(r.team.n)){seen.add(r.team.n);r.badge=r.team}});

  const box=document.getElementById('rows');
  box.innerHTML='<div class="row h"><span>Описание</span><span>Автор</span><span>Трек / этап</span><span>Коммит</span></div>';
  rows.forEach(r=>{
    const d=document.createElement('div');
    const dead=r.team&&r.team.total===0;
    d.className='row'+(dead?' dim':'');
    let pre='';
    if(r.release) pre='<i class="bd head">HEAD → main</i><i class="bd tag">tag: итог</i>';
    if(r.badge) pre=r.badge.total>0?`<i class="bd live">${r.badge.branch}</i>`:`<i class="bd gone">${r.badge.branch}</i><span style="color:#f85149">[нет коммитов]</span> `;
    if(r.reg) pre=`<i class="sw" style="background:${EXPC[r.reg.e]};margin-right:8px;vertical-align:-1px"></i>`;
    d.innerHTML=`<span>${pre}<span class="${r.main?'m':'t'}">${r.msg}</span></span><span class="d">${r.author}</span><span class="d">${r.stage}</span><span class="x">${r.hash}</span>`;
    tipOn(d,r.tip);
    box.appendChild(d);
  });
})();

/* ---------- вкладки ---------- */
(()=>{
  const SUB={
    net:'',
    log:''
  };
  const sub=document.getElementById('sub');
  const show=k=>{
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===k));
    document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!==k);
    sub.innerHTML=SUB[k];
  };
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.tab));
  show(location.hash==='#log'?'log':'net');
})();
